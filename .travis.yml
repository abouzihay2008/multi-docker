sudo: required
service:
  - docker
before_install:
  -docker build -t abouzihay/react-test ./client/Dockerfile.dev ./client

script:
  -docker run abouzihay/react-test npm test -- --coverage

  after_success:
    -docker build -t abouzihay/mult-client  ./client
    -docker build -t abouzihay/mult-nginx  ./nginx
    -docker build -t abouzihay/mult-server  ./server
    -docker build -t abouzihay/mult-worker  ./worker
